    <style>
        /* 
           THE ULTIMATE JITTER FIX:
           1. scrollbar-gutter: stable ensures the layout width is calculated 
              AS IF a scrollbar is always there, even if it's hidden.
           2. We apply this to 'html' so the root viewport is stable.
        */
        html {
            height: 100%;
        }

        /* 
           Lock the scroll on the body, NOT the html.
           This allows the html element to maintain its stable gutter 
           while the body content is prevented from scrolling.
        */
        body.modal-open {
            overflow: hidden !important;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.5s ease, color 0.5s ease;
            min-height: 100%;
            width: 100%;
            position: relative;
            /* Safari font rendering fix */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            background-color: #050505;
            /* Force dark background for Safari initial load */
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Safari-optimized pulse animations with hardware acceleration */
        @keyframes pulse-ring {
            0% {
                transform: scale3d(.33, .33, 1);
                opacity: 0.75;
            }

            80%,
            100% {
                transform: scale3d(1, 1, 1);
                opacity: 0;
            }
        }

        @keyframes pulse-dot {
            0% {
                transform: scale3d(.8, .8, 1);
            }

            50% {
                transform: scale3d(1, 1, 1);
            }

            100% {
                transform: scale3d(.8, .8, 1);
            }
        }

        .pulse-ring {
            animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            will-change: transform, opacity;
        }

        .pulse-dot {
            animation: pulse-dot 1.25s cubic-bezier(0.455, 0.03, 0.515, 0.955) -0.4s infinite;
            will-change: transform;
        }

        /* Safari-optimized modal animations with translate3d for hardware acceleration */
        @keyframes modal-scale-up {
            from {
                opacity: 0;
                transform: scale3d(0.95, 0.95, 1) translate3d(0, 20px, 0);
            }

            to {
                opacity: 1;
                transform: scale3d(1, 1, 1) translate3d(0, 0, 0);
            }
        }

        @keyframes modal-scale-down {
            from {
                opacity: 1;
                transform: scale3d(1, 1, 1) translate3d(0, 0, 0);
            }

            to {
                opacity: 0;
                transform: scale3d(0.97, 0.97, 1) translate3d(0, 10px, 0);
            }
        }

        @keyframes backdrop-fade-in {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes backdrop-fade-out {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        .animate-modal-entry {
            animation: modal-scale-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: transform, opacity;
        }

        .animate-modal-exit {
            animation: modal-scale-down 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: transform, opacity;
        }

        .animate-backdrop-entry {
            animation: backdrop-fade-in 0.3s ease forwards;
        }

        .animate-backdrop-exit {
            animation: backdrop-fade-out 0.25s ease forwards;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0D0D0D;
        }

        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #404040;
        }

        .theme-transition {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes page-entry {
            from {
                opacity: 0;
                transform: translate3d(0, 20px, 0);
            }

            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        .animate-page-entry {
            animation: page-entry 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Performance optimization: contain layout for isolated components */
        .modal-container {
            contain: layout style paint;
        }

        /* Reduce backdrop-filter usage for Safari performance */
        .backdrop-blur-light {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .backdrop-blur-heavy {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* Safari-optimized hover scale effect */
        .group:hover .hover-scale-safari {
            transform: scale(1.1);
        }
    </style>
