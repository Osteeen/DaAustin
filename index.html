    <style>
        /* 
           THE ULTIMATE JITTER FIX:
           1. scrollbar-gutter: stable ensures the layout width is calculated 
              AS IF a scrollbar is always there, even if it's hidden.
           2. We apply this to 'html' so the root viewport is stable.
        */
        html {
            scrollbar-gutter: stable;
            height: 100%;
        }

        /* 
           Lock the scroll on the body, NOT the html.
           This allows the html element to maintain its stable gutter 
           while the body content is prevented from scrolling.
        */
        body.modal-open {
            overflow: hidden !important;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.5s ease, color 0.5s ease;
            min-height: 100%;
            width: 100%;
            position: relative;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(.33);
            }

            80%,
            100% {
                opacity: 0;
            }
        }

        @keyframes pulse-dot {
            0% {
                transform: scale(.8);
            }

            50% {
                transform: scale(1);
            }

            100% {
                transform: scale(.8);
            }
        }

        .pulse-ring {
            animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .pulse-dot {
            animation: pulse-dot 1.25s cubic-bezier(0.455, 0.03, 0.515, 0.955) -0.4s infinite;
        }

        /* Modal Animations */
        @keyframes modal-scale-up {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes modal-scale-down {
            from {
                opacity: 1;
                transform: scale(1) translateY(0);
            }

            to {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
        }

        @keyframes backdrop-fade-in {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes backdrop-fade-out {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        .animate-modal-entry {
            animation: modal-scale-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-modal-exit {
            animation: modal-scale-down 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-backdrop-entry {
            animation: backdrop-fade-in 0.5s ease forwards;
        }

        .animate-backdrop-exit {
            animation: backdrop-fade-out 0.4s ease forwards;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0D0D0D;
        }

        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #404040;
        }

        .theme-transition {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes page-entry {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-page-entry {
            animation: page-entry 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
    </style>
